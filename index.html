<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Offline-only app: everything this page loads is same-origin (bundled
      fonts, a same-origin pdf.js worker) or made in the page itself from
      bytes the app already holds: images are blob: URLs the app creates from
      a book's own archive (img-src allows blob:; the sanitizer additionally
      lets only blob: URLs the app itself created through - see epub.ts), and
      data: remains for the PDF page rasters. No remote origin is ever
      legitimate here, so connect-src/img-src/font-src/etc. are all scoped to
      'self' with no exceptions carved out for a CDN. blob: is NOT allowed for
      script-src, worker-src or connect-src - only for images.
      style-src needs 'unsafe-inline' because both React's own dynamic
      inline styles (font/size/theme controls) and sanitized chapter content
      use real style="" attributes, not stylesheets - CSS alone can't
      execute script, and the sanitizer independently restricts which
      properties/values survive in chapter content anyway (see epub.ts).
      Verified empirically (real Chromium, production bundle, an EPUB with
      both a plain <img> and an SVG-wrapped cover, and a real PDF) with zero
      securitypolicyviolation events: worker-src 'self' alone is enough for
      pdf.js's worker - no blob: needed, since the worker is instantiated
      from the same-origin static URL Vite's ?url import produces, not a
      Blob. No other directive needed loosening either.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
